<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reaction">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Reaction Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #00c853;
      --red: #e53935;
      --blue: #4db8ff;
      --gold: #ffd700;
      --bg: #0a0a0f;
      --card: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.08);
      --text-dim: rgba(255,255,255,0.4);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: white;
      text-align: center;
      user-select: none;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ambient glow */
    body::before {
      content: '';
      position: fixed; top: -20%; left: 50%;
      transform: translateX(-50%);
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0,200,100,0.06) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
      transition: background 0.8s ease;
    }
    body.state-wait::before { background: radial-gradient(circle, rgba(220,50,50,0.1) 0%, transparent 70%); }
    body.state-go::before   { background: radial-gradient(circle, rgba(0,220,100,0.14) 0%, transparent 70%); }

    /* ─── Tab pages ─────────────────────────────────────────── */
    #pages { flex: 1; overflow: hidden; position: relative; }
    .page  { position: absolute; inset: 0; overflow-y: auto; padding: 0 16px 16px; display: none; flex-direction: column; }
    .page.active { display: flex; }

    /* ─── Bottom tab bar ────────────────────────────────────── */
    #tab-bar {
      position: relative; z-index: 10;
      display: flex;
      background: rgba(18,18,24,0.95);
      border-top: 1px solid rgba(255,255,255,0.07);
      padding-bottom: var(--safe-bottom);
      backdrop-filter: blur(20px);
    }
    .tab-item {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: 10px 0 8px; cursor: pointer; transition: opacity 0.15s;
      border: none; background: transparent; color: var(--text-dim);
      font-family: inherit; -webkit-tap-highlight-color: transparent;
    }
    .tab-item.active { color: var(--green); }
    .tab-icon { font-size: 22px; line-height: 1; }
    .tab-label { font-size: 10px; font-weight: 600; margin-top: 3px; letter-spacing: 0.03em; }

    /* ─── Shared header ────────────────────────────────────── */
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0 12px; position: relative; z-index: 1;
    }
    .page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
    .header-action { font-size: 13px; font-weight: 600; color: var(--green); cursor: pointer; background: none; border: none; font-family: inherit; }

    /* ─── GAME PAGE ─────────────────────────────────────────── */
    #page-game { padding-top: 0; }

    /* auth bar inside game page */
    #auth-bar {
      display: flex; align-items: center; justify-content: flex-end;
      padding: 14px 0 8px; gap: 10px; position: relative; z-index: 1;
    }
    #auth-bar img { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2); }
    #auth-bar span { font-size: 13px; color: var(--text-dim); font-weight: 500; }
    .auth-btn { font-size: 13px; font-weight: 600; padding: 6px 13px; border: none; border-radius: 20px; cursor: pointer; transition: opacity 0.15s; font-family: inherit; }
    .auth-btn:active { opacity: 0.7; }
    #sign-in-btn  { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.15); }
    #sign-out-btn { background: rgba(255,255,255,0.07); color: var(--text-dim); border: 1px solid var(--border); }

    /* Apple Watch-style circular game button */
    #watch-ring-wrap {
      position: relative; width: min(72vw, 280px); margin: 4px auto 16px;
      aspect-ratio: 1; flex-shrink: 0;
    }

    #watch-ring {
      position: absolute; inset: 0; border-radius: 50%;
      background: var(--card); border: 2px solid var(--border);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    #watch-ring.state-idle   { background: rgba(255,255,255,0.04); border-color: var(--border); }
    #watch-ring.state-wait   { background: rgba(200,40,40,0.22); border-color: rgba(220,60,60,0.5); box-shadow: 0 0 50px rgba(200,40,40,0.25), inset 0 0 40px rgba(200,40,40,0.1); animation: pulse-wait 1.4s ease-in-out infinite; }
    #watch-ring.state-go     { background: rgba(0,190,80,0.25); border-color: rgba(0,220,90,0.6); box-shadow: 0 0 70px rgba(0,200,80,0.35), inset 0 0 40px rgba(0,200,80,0.1); animation: pulse-go 0.55s ease-in-out infinite; }
    #watch-ring.state-result { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.15); }
    #watch-ring.flash        { animation: flash 0.18s ease-out forwards !important; }

    /* outer decorative ring SVG */
    #watch-svg { position: absolute; inset: -8px; pointer-events: none; }
    #watch-arc { transition: stroke-dashoffset 0.5s ease, stroke 0.5s ease; }

    @keyframes pulse-wait { 0%,100% { box-shadow: 0 0 35px rgba(200,40,40,0.15); } 50% { box-shadow: 0 0 60px rgba(200,40,40,0.35); } }
    @keyframes pulse-go   { 0%,100% { box-shadow: 0 0 45px rgba(0,200,80,0.25); transform: scale(1); } 50% { box-shadow: 0 0 80px rgba(0,200,80,0.5); transform: scale(1.008); } }
    @keyframes flash      { 0% { filter: brightness(1.9); } 100% { filter: brightness(1); } }

    #game-text    { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; line-height: 1; }
    #game-sub     { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.5); margin-top: 6px; min-height: 16px; }
    #reaction-rating { font-size: 18px; font-weight: 800; min-height: 24px; transition: opacity 0.3s; }

    /* difficulty row */
    #difficulty-row { display: flex; gap: 6px; margin-bottom: 12px; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 3px; }
    .diff-btn { flex: 1; font-size: 13px; font-weight: 600; padding: 7px 0; border: none; border-radius: 9px; background: transparent; color: var(--text-dim); cursor: pointer; transition: all 0.2s; font-family: inherit; }
    .diff-btn.active { background: rgba(255,255,255,0.1); color: white; }

    /* action buttons row — Start / Stop + icon buttons */
    #btn-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .game-btn { font-size: 15px; font-weight: 600; padding: 13px; border: none; border-radius: 16px; cursor: pointer; transition: transform 0.1s, opacity 0.1s; -webkit-tap-highlight-color: transparent; font-family: inherit; flex: 1; }
    .game-btn:active { transform: scale(0.96); opacity: 0.8; }
    .icon-btn { flex: 0 0 auto; padding: 13px 14px; font-size: 17px; }
    #start-btn { background: linear-gradient(135deg, var(--green), #00a844); color: white; box-shadow: 0 4px 18px rgba(0,200,80,0.28); }
    #stop-btn  { background: var(--card); color: var(--text-dim); border: 1px solid var(--border); }
    .icon-btn  { background: var(--card); border: 1px solid var(--border); color: var(--text-dim); }

    #stats-bar { font-size: 13px; color: var(--text-dim); min-height: 18px; font-weight: 500; }
    .streak-badge { display: inline-block; background: linear-gradient(135deg,#ff6b00,#ff3d00); color: white; font-size: 11px; font-weight: 700; border-radius: 7px; padding: 2px 7px; margin-left: 5px; }

    #guest-notice { font-size: 12px; color: rgba(255,255,255,0.25); margin: 6px 0 2px; min-height: 16px; }

    /* ─── LEADERBOARD PAGE ──────────────────────────────────── */
    #lb-tabs { display: flex; gap: 0; background: var(--card); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
    .lb-tab  { flex: 1; font-size: 13px; font-weight: 600; padding: 7px; border: none; border-radius: 9px; background: transparent; color: var(--text-dim); cursor: pointer; transition: all 0.2s; font-family: inherit; }
    .lb-tab.active { background: rgba(255,255,255,0.1); color: white; }

    .lb-live { font-size: 11px; font-weight: 600; color: var(--green); display: flex; align-items: center; gap: 4px; }
    .lb-live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: blink 1.5s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

    #scores { list-style: none; display: flex; flex-direction: column; gap: 7px; }
    #scores li { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); cursor: pointer; transition: background 0.15s; -webkit-tap-highlight-color: transparent; }
    #scores li:active { background: rgba(255,255,255,0.09); }
    #scores li.best  { background: rgba(255,196,0,0.07); border-color: rgba(255,196,0,0.2); }
    #scores li.is-me { background: rgba(0,150,255,0.07); border-color: rgba(0,150,255,0.2); }
    #scores li img   { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid var(--border); }
    .rank  { font-size: 13px; font-weight: 700; color: var(--text-dim); width: 22px; text-align: center; flex-shrink: 0; }
    li.best .rank { color: var(--gold); }
    .lname { flex: 1; text-align: left; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    li.best .lname  { color: var(--gold); }
    li.is-me .lname { color: var(--blue); }
    .you-tag { font-size: 9px; font-weight: 700; color: var(--blue); background: rgba(0,150,255,0.15); border-radius: 5px; padding: 1px 5px; margin-left: 5px; vertical-align: middle; }
    .ltime { font-size: 14px; font-weight: 700; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    li.best .ltime  { color: var(--gold); }
    li.is-me .ltime { color: var(--blue); }
    .lb-chevron { font-size: 12px; color: rgba(255,255,255,0.2); flex-shrink: 0; }
    #lb-empty { color: rgba(255,255,255,0.25); font-size: 14px; padding: 24px; background: none !important; border: none !important; justify-content: center; cursor: default; }
    .avatar-placeholder { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.08); flex-shrink: 0; }

    /* challenge button */
    .challenge-row { margin-top: 14px; }
    .text-btn { background: var(--card); border: 1px solid var(--border); color: var(--text-dim); font-size: 13px; font-weight: 600; padding: 11px 18px; border-radius: 14px; cursor: pointer; font-family: inherit; width: 100%; }

    /* ─── PROFILE PAGE ──────────────────────────────────────── */
    .profile-avatar-wrap { position: relative; margin: 8px auto 14px; width: 72px; }
    .profile-avatar { width: 72px; height: 72px; border-radius: 50%; border: 2px solid var(--border); }
    .profile-avatar-placeholder { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 14px; }
    .profile-name { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
    .profile-sub  { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 16px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; text-align: left; }
    .stat-card.highlight { background: rgba(0,200,80,0.07); border-color: rgba(0,200,80,0.2); }
    .stat-val { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
    .stat-card.highlight .stat-val { color: var(--green); }
    .stat-lbl { font-size: 11px; color: var(--text-dim); margin-top: 3px; font-weight: 500; }

    .chart-label { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; text-align: left; font-weight: 500; }
    #mini-chart  { width: 100%; height: 65px; }

    .profile-section-title { font-size: 14px; font-weight: 700; text-align: left; color: var(--text-dim); margin: 18px 0 10px; letter-spacing: 0.03em; text-transform: uppercase; font-size: 11px; }

    .achieve-grid { display: flex; flex-direction: column; gap: 7px; }
    .achieve-item { display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 13px; background: var(--card); border: 1px solid var(--border); }
    .achieve-item.unlocked { background: rgba(0,200,80,0.06); border-color: rgba(0,200,80,0.18); }
    .achieve-icon { font-size: 22px; flex-shrink: 0; width: 32px; text-align: center; }
    .achieve-locked .achieve-icon { filter: grayscale(1); opacity: 0.25; }
    .achieve-info { flex: 1; text-align: left; }
    .achieve-name { font-size: 13px; font-weight: 700; }
    .achieve-locked .achieve-name { color: rgba(255,255,255,0.25); }
    .achieve-desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

    .sign-out-row { margin-top: 20px; }

    /* ─── MODALS ─────────────────────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(14px);
      z-index: 200; align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      background: #16161e; border: 1px solid rgba(255,255,255,0.09);
      border-radius: 26px 26px 0 0; padding: 24px 20px calc(24px + var(--safe-bottom));
      width: 100%; max-width: 480px;
      animation: slide-up 0.28s cubic-bezier(0.34,1.4,0.64,1);
      max-height: 90dvh; overflow-y: auto;
    }
    @keyframes slide-up { from { transform: translateY(110%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-sheet h2 { font-size: 19px; font-weight: 700; margin-bottom: 18px; }
    .modal-close { width: 100%; font-size: 15px; font-weight: 600; padding: 14px; border: none; border-radius: 15px; background: var(--card); color: var(--text-dim); cursor: pointer; margin-top: 14px; font-family: inherit; border: 1px solid var(--border); }
    .modal-handle { width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15); margin: 0 auto 16px; }

    /* auth modal */
    .auth-tabs { display: flex; background: var(--card); border-radius: 11px; padding: 3px; margin: 14px 0; }
    .auth-tab  { flex: 1; font-size: 13px; font-weight: 600; padding: 8px; border: none; border-radius: 8px; background: transparent; color: var(--text-dim); cursor: pointer; transition: all 0.2s; font-family: inherit; }
    .auth-tab.active { background: rgba(255,255,255,0.1); color: white; }
    .auth-field { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid var(--border); border-radius: 13px; color: white; font-size: 16px; padding: 13px 15px; margin-bottom: 9px; outline: none; font-family: inherit; transition: border-color 0.2s; }
    .auth-field:focus { border-color: rgba(0,200,80,0.5); }
    .auth-field::placeholder { color: rgba(255,255,255,0.22); }
    #auth-error { font-size: 12px; color: #ff5555; min-height: 16px; margin-bottom: 8px; text-align: left; }
    .auth-submit { width: 100%; font-size: 16px; font-weight: 700; padding: 14px; border: none; border-radius: 15px; background: linear-gradient(135deg,var(--green),#00a844); color: white; cursor: pointer; margin-bottom: 12px; font-family: inherit; box-shadow: 0 4px 18px rgba(0,200,80,0.25); }
    .auth-divider { display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,0.18); font-size: 12px; margin-bottom: 12px; }
    .auth-divider::before,.auth-divider::after { content:''; flex:1; height:1px; background: var(--border); }
    .google-btn { width: 100%; font-size: 14px; font-weight: 600; padding: 13px; border: 1px solid var(--border); border-radius: 15px; background: var(--card); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; font-family: inherit; }
    .google-icon { width: 17px; height: 17px; flex-shrink: 0; }
    .auth-cancel { width: 100%; font-size: 13px; font-weight: 600; padding: 11px; border: none; border-radius: 13px; background: transparent; color: rgba(255,255,255,0.3); cursor: pointer; font-family: inherit; }

    /* player profile modal */
    .player-modal-avatar { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 10px; border: 2px solid var(--border); display: block; }
    .player-modal-name   { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .player-modal-sub    { font-size: 13px; color: var(--text-dim); margin-bottom: 18px; }
    .player-stats-row    { display: flex; gap: 8px; margin-bottom: 8px; }
    .player-stat         { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
    .player-stat .val    { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; }
    .player-stat .lbl    { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

    /* multiplayer modal */
    .mp-scores { display: flex; gap: 8px; margin-bottom: 12px; }
    .mp-score-card { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
    .mp-score-card.winner { background: rgba(255,196,0,0.09); border-color: rgba(255,196,0,0.3); }
    .mp-player-name  { font-size: 12px; color: var(--text-dim); font-weight: 600; margin-bottom: 3px; }
    .mp-player-score { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .mp-score-card.winner .mp-player-score { color: var(--gold); }
    .mp-round-info { font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
    #mp-game-box { width: 100%; aspect-ratio: 5/3; border-radius: 18px; background: var(--card); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; cursor: pointer; margin-bottom: 12px; transition: background 0.2s, border-color 0.2s; -webkit-tap-highlight-color: transparent; }
    #mp-game-box.mp-wait   { background: rgba(200,40,40,0.2); border-color: rgba(220,60,60,0.4); animation: pulse-wait 1.5s ease-in-out infinite; }
    #mp-game-box.mp-go     { background: rgba(0,190,80,0.22); border-color: rgba(0,220,90,0.5); animation: pulse-go 0.6s ease-in-out infinite; }
    #mp-game-box.mp-result { background: var(--card); border-color: rgba(255,255,255,0.12); }
    #mp-sub { font-size: 13px; color: var(--text-dim); margin-top: 5px; min-height: 16px; }

    /* confetti */
    #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 300; }

    /* achievement toast */
    #achieve-toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(60px); background: #18181f; border: 1px solid rgba(0,200,80,0.3); border-radius: 14px; padding: 11px 16px; display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; z-index: 400; transition: transform 0.35s cubic-bezier(0.34,1.4,0.64,1), opacity 0.35s; opacity: 0; white-space: nowrap; box-shadow: 0 8px 28px rgba(0,0,0,0.4); pointer-events: none; }
    #achieve-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #achieve-toast-icon { font-size: 20px; }

    /* challenge */
    #challenge-link-box { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 13px; color: rgba(255,255,255,0.6); font-size: 12px; padding: 11px 13px; margin-bottom: 11px; word-break: break-all; text-align: left; font-family: inherit; }
    .copy-btn { width: 100%; font-size: 15px; font-weight: 600; padding: 13px; border: none; border-radius: 15px; background: linear-gradient(135deg,var(--green),#00a844); color: white; cursor: pointer; margin-bottom: 9px; font-family: inherit; }
  </style>
</head>
<body class="state-idle">

  <canvas id="confetti-canvas"></canvas>
  <div id="achieve-toast"><span id="achieve-toast-icon"></span><span id="achieve-toast-text"></span></div>

  <!-- ─── AUTH modal ─────────────────────────────────────── -->
  <div id="auth-overlay" class="modal-overlay" onclick="handleOverlayClick(event,'auth-overlay')">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h2 id="auth-title">Welcome back</h2>
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-signin" onclick="switchTab('signin')">Sign in</button>
        <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Create account</button>
      </div>
      <div id="signup-name-wrap" style="display:none">
        <input class="auth-field" id="auth-display-name" type="text" placeholder="Display name" maxlength="20" autocomplete="username">
      </div>
      <input class="auth-field" id="auth-email" type="email" placeholder="Email" autocomplete="email">
      <input class="auth-field" id="auth-password" type="password" placeholder="Password" autocomplete="current-password">
      <div id="auth-error"></div>
      <button class="auth-submit" id="auth-submit-btn" onclick="submitAuth()">Sign in</button>
      <div class="auth-divider">or</div>
      <button class="google-btn" onclick="signInGoogle()">
        <svg class="google-icon" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>

    <button class="tab-item" id="tab-lb" onclick="switchPage('lb')">

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDDnBWZOwrPxCJcOPsAajx0cMmbyHTf6dY",
      authDomain: "apple-watch-game.firebaseapp.com",
      projectId: "apple-watch-game",
      storageBucket: "apple-watch-game.firebasestorage.app",
      messagingSenderId: "448909758594",
      appId: "1:448909758594:web:446d2ad94110ed04c1a49b"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db   = firebase.firestore();

    // ── Tab navigation ────────────────────────────────────────
    function switchPage(name) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      document.getElementById('page-' + name).classList.add('active');
      document.getElementById('tab-' + name).classList.add('active');
      if (name === 'profile') renderProfile();
    }

    // ── Auth ──────────────────────────────────────────────────
    let currentUser = null;

    auth.onAuthStateChanged(async user => {
      currentUser = user;
      if (user) {
        document.getElementById('sign-in-btn').style.display = 'none';
        document.getElementById('user-info').style.display   = 'flex';
        document.getElementById('user-name').textContent     = user.displayName || user.email || 'Player';
        document.getElementById('user-photo').src            = user.photoURL || '';
        document.getElementById('guest-notice').textContent  = '';
        closeModal('auth-overlay');
        const doc = await db.collection('scores').doc(user.uid).get();
        if (doc.exists) allTimeBest = doc.data().time;
      } else {
        document.getElementById('sign-in-btn').style.display = 'block';
        document.getElementById('user-info').style.display   = 'none';
        document.getElementById('guest-notice').textContent  = 'Sign in to appear on the leaderboard';
        allTimeBest = null;
      }
    });

    function signOut() { auth.signOut(); }

    // ── Auth modal ────────────────────────────────────────────
    let authMode = 'signin';

    function openAuthModal() {
      switchTab('signin');
      document.getElementById('auth-error').textContent = '';
      ['auth-email','auth-password','auth-display-name'].forEach(id => { const el = document.getElementById(id); if(el) el.value=''; });
      openModal('auth-overlay');
    }

    function switchTab(mode) {
      authMode = mode;
      document.getElementById('tab-signin').classList.toggle('active', mode==='signin');
      document.getElementById('tab-signup').classList.toggle('active', mode==='signup');
      document.getElementById('auth-title').textContent       = mode==='signin' ? 'Welcome back' : 'Create account';
      document.getElementById('auth-submit-btn').textContent  = mode==='signin' ? 'Sign in' : 'Create account';
      document.getElementById('signup-name-wrap').style.display = mode==='signup' ? 'block' : 'none';
      document.getElementById('auth-password').autocomplete  = mode==='signup' ? 'new-password' : 'current-password';
      document.getElementById('auth-error').textContent      = '';
    }

    async function submitAuth() {
      const email = document.getElementById('auth-email').value.trim();
      const pass  = document.getElementById('auth-password').value;
      const errEl = document.getElementById('auth-error');
      errEl.textContent = '';
      if (!email||!pass) { errEl.textContent='Please fill in all fields.'; return; }
      try {
        if (authMode==='signin') {
          await auth.signInWithEmailAndPassword(email, pass);
        } else {
          const name = document.getElementById('auth-display-name').value.trim() || email.split('@')[0];
          const cred = await auth.createUserWithEmailAndPassword(email, pass);
          await cred.user.updateProfile({ displayName: name });
        }
      } catch(err) { errEl.textContent = friendlyAuthError(err.code); }
    }

    function signInGoogle() {
      auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err => {
        document.getElementById('auth-error').textContent = friendlyAuthError(err.code);
      });
    }

    function friendlyAuthError(code) {
      return ({'auth/invalid-email':'Invalid email.','auth/user-not-found':'No account with that email.','auth/wrong-password':'Incorrect password.','auth/invalid-credential':'Incorrect email or password.','auth/email-already-in-use':'Email already in use.','auth/weak-password':'Password must be 6+ characters.','auth/too-many-requests':'Too many attempts. Try later.','auth/popup-closed-by-user':''})[code]||'Something went wrong.';
    }

    // ── Modal helpers ─────────────────────────────────────────
    function openModal(id)  { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    function handleOverlayClick(e,id) { if(e.target===document.getElementById(id)) closeModal(id); }

    // ── Difficulty ────────────────────────────────────────────
    const DIFFICULTY = {
      easy:   { minDelay:2000, maxDelay:4000, window:null },
      normal: { minDelay:1500, maxDelay:4500, window:null },
      hard:   { minDelay:800,  maxDelay:3000, window:1200 },
    };
    let difficulty = 'normal';

    function setDifficulty(d) {
      difficulty = d;
      document.querySelectorAll('.diff-btn').forEach((b,i)=>b.classList.toggle('active',['easy','normal','hard'][i]===d));
    }
    setDifficulty('normal');

    // ── Sound ─────────────────────────────────────────────────
    let soundOn = true;
    function toggleSound() {
      soundOn = !soundOn;
      document.getElementById('sound-btn').textContent = soundOn ? '🔊' : '🔇';
    }

    function playTapSound() {
      if (!soundOn) return;
      try {
        const ctx=new(window.AudioContext||window.webkitAudioContext)();
        const osc=ctx.createOscillator(), gain=ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(900,ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(450,ctx.currentTime+0.12);
        gain.gain.setValueAtTime(0.25,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.18);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime+0.18);
      } catch(e){}
    }

    // ── Haptics ───────────────────────────────────────────────
    function haptic(type) {
      if (!navigator.vibrate) return;
      if (type==='tap')   navigator.vibrate(30);
      if (type==='go')    navigator.vibrate([18,8,18]);
      if (type==='early') navigator.vibrate([50,20,50]);
      if (type==='best')  navigator.vibrate([15,8,15,8,35]);
    }

    // ── Bot mode (tap title 5x) ───────────────────────────────
    let botMode=false, titleTaps=0, titleTapTimer, botTapTimeout;

    document.getElementById('game-text').addEventListener('click', e => {
      e.stopPropagation();
      clearTimeout(titleTapTimer);
      titleTaps++;
      titleTapTimer = setTimeout(()=>{ titleTaps=0; }, 900);
      if (titleTaps>=5) {
        titleTaps=0; botMode=!botMode;
        document.getElementById('game-sub').textContent = botMode ? '🤖 Bot on' : '';
        if (!botMode) clearTimeout(botTapTimeout);
      }
    });

    // ── Arc progress ring ─────────────────────────────────────
    const ARC_CIRC = 879.6;
    function setArc(fraction, color) {
      const arc = document.getElementById('watch-arc');
      arc.style.strokeDashoffset = ARC_CIRC * (1 - fraction);
      arc.style.stroke = color || 'var(--green)';
    }

    // ── Game state ────────────────────────────────────────────
    let waiting=false, ready=false, running=false;
    let startTime=0, streak=0, maxStreakSession=0;
    let sessionTimes=[];
    let timeout, nextRoundTimeout, windowTimeout;
    let allTimeBest = null;

    const ringEl   = document.getElementById('watch-ring');
    const gameText = document.getElementById('game-text');
    const gameSub  = document.getElementById('game-sub');
    const statsBarEl = document.getElementById('stats-bar');
    const ratingEl   = document.getElementById('reaction-rating');

    function setGameState(state) {
      ringEl.className = 'state-' + state;
      document.body.className = 'state-' + state;
    }

    function startGame() {
      running=true; streak=0; sessionTimes=[];
      setArc(0);
      updateStatsBar(); nextRound();
    }

    function stopGame() {
      running=false; waiting=false; ready=false;
      clearTimeout(timeout); clearTimeout(nextRoundTimeout); clearTimeout(windowTimeout);
      setGameState('idle');
      gameText.textContent='Tap Start'; gameSub.textContent='';
      ratingEl.textContent=''; setArc(0);
    }

    function nextRound() {
      clearTimeout(nextRoundTimeout); clearTimeout(windowTimeout);
      setGameState('wait');
      gameText.textContent='Wait...'; gameSub.textContent='';
      setArc(0, 'var(--red, #e53935)');
      waiting=true; ready=false;

      const cfg=DIFFICULTY[difficulty];
      const delay=Math.random()*(cfg.maxDelay-cfg.minDelay)+cfg.minDelay;
      clearTimeout(timeout);
      timeout=setTimeout(()=>{
        setGameState('go');
        gameText.textContent='TAP!';
        gameSub.textContent=difficulty==='hard'?'Be quick!':'';
        setArc(1, 'var(--green)');
        startTime=Date.now(); ready=true;
        haptic('go');
        if (botMode) botTapTimeout=setTimeout(()=>{ if(ready&&botMode) handleTap(); },0);
        if (cfg.window) {
          windowTimeout=setTimeout(()=>{
            if(ready){ ready=false; waiting=false; streak=0;
              setGameState('result'); gameText.textContent='Too slow!'; gameSub.textContent='';
              setArc(0); updateStatsBar();
              if(running) nextRoundTimeout=setTimeout(nextRound,1300);
            }
          }, cfg.window);
        }
      }, delay);
    }

    function handleTap() {
      if (waiting && !ready) {
        clearTimeout(timeout); streak=0;
        setGameState('result'); gameText.textContent='Too early!'; gameSub.textContent='';
        ratingEl.textContent=''; setArc(0);
        waiting=false; haptic('early'); updateStatsBar();
        if(running) nextRoundTimeout=setTimeout(nextRound,1300);
        return;
      }
      if (ready) {
        clearTimeout(windowTimeout);
        const reaction=Date.now()-startTime;
        ringEl.classList.remove('flash'); void ringEl.offsetWidth; ringEl.classList.add('flash');
        playTapSound(); haptic('tap');
        setGameState('result'); gameText.textContent=reaction+' ms';
        sessionTimes.push(reaction); streak++;
        maxStreakSession=Math.max(maxStreakSession,streak);

        const tr=parseInt(localStorage.getItem('totalRounds')||'0')+1;
        localStorage.setItem('totalRounds',tr);
        localStorage.setItem('maxStreak',Math.max(parseInt(localStorage.getItem('maxStreak')||'0'),maxStreakSession));

        // arc fills based on how good the reaction is (150ms=full, 500ms=empty)
        const arcFrac = Math.max(0, Math.min(1, 1-(reaction-150)/350));
        setArc(arcFrac);

        const isNewBest = !botMode && currentUser && (allTimeBest===null || reaction<allTimeBest);
        const isSessionBest = sessionTimes.length>1 && reaction===Math.min(...sessionTimes);

        if (isNewBest) { gameSub.textContent='🏆 New personal best!'; launchConfetti(); haptic('best'); }
        else if (isSessionBest) { gameSub.textContent='New session best!'; }
        else if (streak>=3) { gameSub.textContent='Streak: '+streak; }
        else { gameSub.textContent=''; }

        if (!botMode) { showRating(reaction); saveScore(reaction); checkAchievements(); }
        waiting=false; ready=false; updateStatsBar();
        if(running) nextRoundTimeout=setTimeout(nextRound,1400);
      }
    }

    // ── Rating ────────────────────────────────────────────────
    const RATINGS=[
      {max:150,label:'⚡ Superhuman',color:'#ff4fc8'},
      {max:200,label:'🥷 Ninja',     color:'#00c853'},
      {max:250,label:'🎯 Sharp',     color:'#4db8ff'},
      {max:320,label:'👍 Human',     color:'#ffd700'},
      {max:420,label:'😐 Average',   color:'#aaa'},
      {max:9999,label:'🐢 Slow',     color:'#ff5555'},
    ];

    function ratingFor(ms) { return RATINGS.find(r=>ms<r.max); }

    function showRating(ms) {
      const r=ratingFor(ms);
      ratingEl.textContent=r.label; ratingEl.style.color=r.color; ratingEl.style.opacity='1';
      clearTimeout(ratingEl._t);
      ratingEl._t=setTimeout(()=>{ ratingEl.style.opacity='0'; },2000);
    }

    // ── Stats bar ─────────────────────────────────────────────
    function updateStatsBar() {
      if(!sessionTimes.length){ statsBarEl.textContent=''; return; }
      const avg=Math.round(sessionTimes.reduce((a,b)=>a+b,0)/sessionTimes.length);
      const best=Math.min(...sessionTimes);
      let html='Avg: <b>'+avg+' ms</b> &nbsp;·&nbsp; Best: <b>'+best+' ms</b>';
      if(streak>=3) html+=" &nbsp;<span class='streak-badge'>🔥 "+streak+'</span>';
      statsBarEl.innerHTML=html;
    }

    // ── Confetti ──────────────────────────────────────────────
    function launchConfetti() {
      const canvas=document.getElementById('confetti-canvas');
      canvas.width=window.innerWidth; canvas.height=window.innerHeight;
      const ctx=canvas.getContext('2d');
      const pieces=Array.from({length:70},()=>({
        x:Math.random()*canvas.width, y:Math.random()*-canvas.height*0.4,
        w:5+Math.random()*8, h:3+Math.random()*5,
        r:Math.random()*Math.PI*2, vx:(Math.random()-0.5)*3,
        vy:2+Math.random()*4, vr:(Math.random()-0.5)*0.2,
        color:['#00c853','#ffd700','#ff6b00','#4db8ff','#ff4fc8'][Math.floor(Math.random()*5)]
      }));
      let frame, tick=0;
      function draw(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        pieces.forEach(p=>{
          ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
          ctx.fillStyle=p.color; ctx.globalAlpha=Math.max(0,1-tick/110);
          ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
          p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.vy+=0.1;
        });
        tick++;
        if(tick<120) frame=requestAnimationFrame(draw);
        else ctx.clearRect(0,0,canvas.width,canvas.height);
      }
      cancelAnimationFrame(frame); tick=0; draw();
    }

    // ── Achievements ──────────────────────────────────────────
    const ACHIEVEMENTS=[
      {id:'first',   icon:'🎮',name:'First Tap',    desc:'Complete your first round',       check:s=>s.totalRounds>=1},
      {id:'sub300',  icon:'⚡',name:'Sub 300ms',    desc:'React in under 300ms',             check:s=>s.best!==null&&s.best<300},
      {id:'sub250',  icon:'🎯',name:'Sub 250ms',    desc:'React in under 250ms',             check:s=>s.best!==null&&s.best<250},
      {id:'sub200',  icon:'🥷',name:'Ninja',        desc:'React in under 200ms',             check:s=>s.best!==null&&s.best<200},
      {id:'sub150',  icon:'💫',name:'Superhuman',   desc:'React in under 150ms',             check:s=>s.best!==null&&s.best<150},
      {id:'streak5', icon:'🔥',name:'On Fire',      desc:'5-round clean streak',             check:s=>s.maxStreak>=5},
      {id:'streak10',icon:'🌋',name:'Unstoppable',  desc:'10-round clean streak',            check:s=>s.maxStreak>=10},
      {id:'rounds10',icon:'🏃',name:'Warming Up',   desc:'Play 10 rounds',                   check:s=>s.totalRounds>=10},
      {id:'rounds50',icon:'💪',name:'Dedicated',    desc:'Play 50 rounds',                   check:s=>s.totalRounds>=50},
      {id:'top3',    icon:'🏆',name:'Top 3',        desc:'Reach top 3 on the leaderboard',   check:s=>s.lbRank!==null&&s.lbRank<=3},
      {id:'first1',  icon:'🥇',name:'Champion',     desc:'Reach #1 on the leaderboard',      check:s=>s.lbRank===1},
    ];

    let achieveStats={best:null,totalRounds:0,maxStreak:0,lbRank:null};
    let unlockedAchieves=new Set(JSON.parse(localStorage.getItem('achievements')||'[]'));

    function checkAchievements() {
      achieveStats.best        = allTimeBest;
      achieveStats.totalRounds = parseInt(localStorage.getItem('totalRounds')||'0');
      achieveStats.maxStreak   = Math.max(parseInt(localStorage.getItem('maxStreak')||'0'),maxStreakSession);
      ACHIEVEMENTS.forEach(a=>{
        if(!unlockedAchieves.has(a.id)&&a.check(achieveStats)){
          unlockedAchieves.add(a.id);
          localStorage.setItem('achievements',JSON.stringify([...unlockedAchieves]));
          showAchieveToast(a);
        }
      });
    }

    function showAchieveToast(a) {
      const toast=document.getElementById('achieve-toast');
      document.getElementById('achieve-toast-icon').textContent=a.icon;
      document.getElementById('achieve-toast-text').textContent='Achievement: '+a.name;
      toast.classList.add('show');
      setTimeout(()=>toast.classList.remove('show'),3000);
    }

    // ── Firestore ─────────────────────────────────────────────
    async function saveScore(time) {
      if(!currentUser) return;
      const ref=db.collection('scores').doc(currentUser.uid);
      const doc=await ref.get();
      if(!doc.exists||time<doc.data().time) {
        allTimeBest=time;
        await ref.set({uid:currentUser.uid,name:currentUser.displayName||'Player',photoURL:currentUser.photoURL||'',time,timestamp:firebase.firestore.FieldValue.serverTimestamp()});
      }
      const today=new Date().toISOString().slice(0,10);
      const dayRef=db.collection('daily').doc(today).collection('scores').doc(currentUser.uid);
      const dayDoc=await dayRef.get();
      if(!dayDoc.exists||time<dayDoc.data().time) {
        await dayRef.set({uid:currentUser.uid,name:currentUser.displayName||'Player',photoURL:currentUser.photoURL||'',time,timestamp:firebase.firestore.FieldValue.serverTimestamp()});
      }
    }

    // ── Leaderboard ───────────────────────────────────────────
    let lbFilter='alltime', lbUnsub=null;

    function setLbFilter(f) {
      lbFilter=f;
      document.getElementById('lb-tab-alltime').classList.toggle('active',f==='alltime');
      document.getElementById('lb-tab-today').classList.toggle('active',f==='today');
      subscribeLeaderboard();
    }

    function subscribeLeaderboard() {
      if(lbUnsub) lbUnsub();
      const query = lbFilter==='alltime'
        ? db.collection('scores').orderBy('time').limit(10)
        : db.collection('daily').doc(new Date().toISOString().slice(0,10)).collection('scores').orderBy('time').limit(10);

      lbUnsub=query.onSnapshot(snapshot=>{
        const list=document.getElementById('scores');
        list.innerHTML='';
        if(snapshot.empty){ list.innerHTML='<li id="lb-empty">No scores yet — be the first!</li>'; return; }
        snapshot.docs.forEach((doc,i)=>{
          const s=doc.data(), isMe=currentUser&&doc.id===currentUser.uid;
          if(isMe){ achieveStats.lbRank=i+1; checkAchievements(); }
          const li=document.createElement('li');
          if(i===0) li.classList.add('best');
          if(isMe)  li.classList.add('is-me');
          const avatar=s.photoURL?'<img src="'+s.photoURL+'" alt="" referrerpolicy="no-referrer">'  :'<div class="avatar-placeholder"></div>';
          const youTag=isMe?'<span class="you-tag">YOU</span>':'';
          li.innerHTML=
            '<span class="rank">'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1))+'</span>'+
            avatar+
            '<span class="lname">'+escHtml(s.name)+youTag+'</span>'+
            '<span class="ltime">'+s.time+' ms</span>'+
            '<span class="lb-chevron">›</span>';
          li.addEventListener('click',()=>openPlayerModal(s, i+1));
          list.appendChild(li);
        });
      }, err=>console.error('Leaderboard error:',err));
    }

    subscribeLeaderboard();

    // ── Player profile modal ──────────────────────────────────
    function openPlayerModal(s, rank) {
      const photo = document.getElementById('pm-photo');
      if (s.photoURL) { photo.src=s.photoURL; photo.style.display='block'; }
      else { photo.style.display='none'; }
      document.getElementById('pm-name').textContent  = escHtml(s.name);
      document.getElementById('pm-rank').textContent  = rankLabel(rank) + ' on leaderboard';
      document.getElementById('pm-best').textContent  = s.time + ' ms';
      const r = ratingFor(s.time);
      document.getElementById('pm-rating').textContent = r ? r.label : '—';
      openModal('player-overlay');
    }

    function rankLabel(r) {
      return r===1?'🥇 #1':r===2?'🥈 #2':r===3?'🥉 #3':('#'+r);
    }

    // ── Profile page ──────────────────────────────────────────
    function renderProfile() {
      const el = document.getElementById('profile-content');
      if (!currentUser) {
        el.innerHTML = '<div style="padding:30px 0;color:var(--text-dim);font-size:15px;">Sign in to see your profile</div>' +
          '<button class="auth-submit" onclick="openAuthModal()" style="margin-top:8px;">Sign in</button>';
        return;
      }

      const times = sessionTimes;
      const best  = allTimeBest !== null ? allTimeBest + ' ms' : (times.length ? Math.min(...times)+' ms' : '—');
      const avg   = times.length ? Math.round(times.reduce((a,b)=>a+b,0)/times.length)+' ms' : '—';
      const worst = times.length ? Math.max(...times)+' ms' : '—';
      const count = localStorage.getItem('totalRounds') || '0';
      const rating = allTimeBest ? (ratingFor(allTimeBest)||{label:'—'}).label : '—';

      const avatarHtml = currentUser.photoURL
        ? '<img class="profile-avatar" src="'+currentUser.photoURL+'" alt="" referrerpolicy="no-referrer">'
        : '<div class="profile-avatar-placeholder">👤</div>';

      // achievements
      checkAchievements();
      const achieveHtml = ACHIEVEMENTS.map(a=>{
        const unlocked = unlockedAchieves.has(a.id);
        return '<div class="achieve-item '+(unlocked?'unlocked':'achieve-locked')+'">'+
          '<div class="achieve-icon">'+a.icon+'</div>'+
          '<div class="achieve-info"><div class="achieve-name">'+a.name+'</div>'+
          '<div class="achieve-desc">'+a.desc+'</div></div></div>';
      }).join('');

      el.innerHTML =
        '<div class="profile-avatar-wrap">'+avatarHtml+'</div>'+
        '<div class="profile-name">'+escHtml(currentUser.displayName||currentUser.email||'Player')+'</div>'+
        '<div class="profile-sub">'+escHtml(currentUser.email||'')+'</div>'+
        '<div class="stats-grid">'+
          '<div class="stat-card highlight"><div class="stat-val">'+best+'</div><div class="stat-lbl">All-time best</div></div>'+
          '<div class="stat-card"><div class="stat-val">'+rating+'</div><div class="stat-lbl">Rating</div></div>'+
          '<div class="stat-card"><div class="stat-val">'+avg+'</div><div class="stat-lbl">Session avg</div></div>'+
          '<div class="stat-card"><div class="stat-val">'+count+'</div><div class="stat-lbl">Total rounds</div></div>'+
        '</div>'+
        (times.length ? '<div class="chart-label">Last 10 reaction times</div><canvas id="mini-chart" height="65" style="width:100%;"></canvas>' : '')+
        '<div class="profile-section-title">Achievements</div>'+
        '<div class="achieve-grid">'+achieveHtml+'</div>'+
        '<div class="sign-out-row"><button class="modal-close" onclick="signOut()">Sign out</button></div>';

      if (times.length) setTimeout(()=>drawChart(times.slice(-10)),50);
    }

    function drawChart(times) {
      const canvas=document.getElementById('mini-chart');
      if(!canvas) return;
      const ctx=canvas.getContext('2d');
      canvas.width=(canvas.offsetWidth||340)*window.devicePixelRatio;
      canvas.height=65*window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
      const W=canvas.offsetWidth||340, H=65, pad=6;
      ctx.clearRect(0,0,W,H);
      const min=Math.min(...times), max=Math.max(...times), range=max-min||1;
      const pts=times.map((t,i)=>({x:pad+(i/Math.max(times.length-1,1))*(W-pad*2),y:H-pad-((t-min)/range)*(H-pad*2)}));
      ctx.beginPath(); ctx.strokeStyle='#00c853'; ctx.lineWidth=2; ctx.lineJoin='round';
      pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)); ctx.stroke();
      ctx.beginPath(); pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
      ctx.lineTo(pts[pts.length-1].x,H); ctx.lineTo(pts[0].x,H); ctx.closePath();
      ctx.fillStyle='rgba(0,200,80,0.07)'; ctx.fill();
      pts.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fillStyle='#00c853'; ctx.fill(); });
    }

    // ── Challenge ─────────────────────────────────────────────
    function openChallengeModal() {
      const best=allTimeBest||(sessionTimes.length?Math.min(...sessionTimes):null);
      const name=currentUser?(currentUser.displayName||'Someone'):'Someone';
      const url=window.location.href.split('?')[0]+'?challenge='+encodeURIComponent(name)+(best?'&score='+best:'');
      document.getElementById('challenge-link-box').textContent=url;
      document.getElementById('copy-btn').textContent='Copy link';
      openModal('challenge-overlay');
    }

    function copyChallenge() {
      navigator.clipboard.writeText(document.getElementById('challenge-link-box').textContent)
        .then(()=>{ document.getElementById('copy-btn').textContent='Copied!'; })
        .catch(()=>{ document.getElementById('copy-btn').textContent='Copy failed'; });
    }

    (function(){
      const p=new URLSearchParams(window.location.search);
      const c=p.get('challenge'), s=p.get('score');
      if(c){ const n=document.getElementById('guest-notice'); n.textContent='⚡ '+escHtml(c)+(s?' challenged you to beat '+s+' ms!':' challenged you!'); n.style.color=ARC_CIRC?'#ffd700':'#ffd700'; }
    })();

    // ── Multiplayer ───────────────────────────────────────────
    const MP_ROUNDS=5;
    let mpRound=0, mpCurrentPlayer=1, mpScores=[[],[]], mpWaiting=false, mpReady=false;
    let mpTimeout, mpStartTime=0;

    function openMp() { mpReset(); openModal('mp-overlay'); }

    function mpReset() {
      mpRound=0; mpCurrentPlayer=1; mpScores=[[],[]]; mpWaiting=false; mpReady=false;
      clearTimeout(mpTimeout);
      document.getElementById('mp-score-1').textContent='—';
      document.getElementById('mp-score-2').textContent='—';
      document.getElementById('mp-card-1').classList.remove('winner');
      document.getElementById('mp-card-2').classList.remove('winner');
      document.getElementById('mp-text').textContent='Tap to begin';
      document.getElementById('mp-sub').textContent='';
      document.getElementById('mp-game-box').className='';
      document.getElementById('mp-round-info').textContent='Best of '+MP_ROUNDS+' rounds each · Player 1 starts';
      mpUpdateNames();
    }

    function mpUpdateNames() {
      document.getElementById('mp-name-1').textContent='Player 1'+(mpCurrentPlayer===1?' 👆':'');
      document.getElementById('mp-name-2').textContent='Player 2'+(mpCurrentPlayer===2?' 👆':'');
    }

    function mpTap() {
      const box=document.getElementById('mp-game-box');
      const txt=document.getElementById('mp-text');
      const sub=document.getElementById('mp-sub');
      if(!mpWaiting&&!mpReady) {
        if(mpRound>=MP_ROUNDS*2) return;
        mpWaiting=true; box.className='mp-wait'; txt.textContent='Wait...'; sub.textContent='';
        clearTimeout(mpTimeout);
        mpTimeout=setTimeout(()=>{ box.className='mp-go'; txt.textContent='TAP!'; sub.textContent=''; mpStartTime=Date.now(); mpReady=true; mpWaiting=false; }, Math.random()*3000+1500);
        return;
      }
      if(mpWaiting&&!mpReady) {
        clearTimeout(mpTimeout); mpWaiting=false;
        box.className='mp-result'; txt.textContent='Too early!'; sub.textContent='Tap to try again';
        haptic('early'); return;
      }
      if(mpReady) {
        const reaction=Date.now()-mpStartTime;
        mpReady=false; mpWaiting=false; haptic('tap');
        mpScores[mpCurrentPlayer-1].push(reaction);
        const arr=mpScores[mpCurrentPlayer-1];
        const avg=Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
        document.getElementById('mp-score-'+mpCurrentPlayer).textContent=avg+' ms';
        box.className='mp-result'; txt.textContent=reaction+' ms'; sub.textContent=(ratingFor(reaction)||{label:''}).label;
        mpRound++;
        if(mpRound>=MP_ROUNDS*2){ mpFinish(); return; }
        mpCurrentPlayer=mpCurrentPlayer===1?2:1; mpUpdateNames();
        document.getElementById('mp-round-info').textContent='Round '+(mpRound+1)+' of '+(MP_ROUNDS*2)+' · Player '+mpCurrentPlayer;
        setTimeout(()=>{ txt.textContent='Tap to continue'; sub.textContent=''; box.className=''; },1500);
      }
    }

    function mpFinish() {
      const a1=mpScores[0].length?Math.round(mpScores[0].reduce((a,b)=>a+b,0)/mpScores[0].length):9999;
      const a2=mpScores[1].length?Math.round(mpScores[1].reduce((a,b)=>a+b,0)/mpScores[1].length):9999;
      const w=a1<a2?1:a2<a1?2:0;
      document.getElementById('mp-game-box').className='mp-result';
      document.getElementById('mp-text').textContent=w?'Player '+w+' wins! 🎉':'Tie game!';
      document.getElementById('mp-sub').textContent=a1+' ms vs '+a2+' ms';
      document.getElementById('mp-round-info').textContent='Game over — tap Close to play again';
      if(w) document.getElementById('mp-card-'+w).classList.add('winner');
      haptic('best');
    }

    // ── Keyboard ──────────────────────────────────────────────
    document.addEventListener('keydown', e=>{
      if(document.getElementById('auth-overlay').classList.contains('open')){ if(e.key==='Enter') submitAuth(); return; }
      if(e.key==='Escape'){ ['auth-overlay','player-overlay','mp-overlay','challenge-overlay'].forEach(closeModal); return; }
      if((e.key==='Enter'||e.key===' ')&&document.getElementById('page-game').classList.contains('active')){
        e.preventDefault();
        if(!running) startGame(); else handleTap();
      }
    });

    function escHtml(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  </script>

  <script>
    if('serviceWorker' in navigator) navigator.serviceWorker.register('/Apple-Watch-Game/sw.js');
  </script>
