<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reaction Game</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      user-select: none;
    }

    h1 {
      font-size: 26px;
      margin: 15px 0 5px;
    }

    #game {
      margin: 10px auto;
      width: 90vw;
      max-width: 350px;
      height: 230px;
      border-radius: 25px;
      background: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      padding: 10px;
      box-sizing: border-box;
      transition: background 0.1s;
    }

    #game.flash {
      animation: flash 0.25s ease-out;
    }

    @keyframes flash {
      0%   { filter: brightness(2); }
      100% { filter: brightness(1); }
    }

    #game-sub {
      font-size: 15px;
      opacity: 0.7;
      margin-top: 6px;
      min-height: 20px;
    }

    #difficulty-row {
      margin: 8px auto;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .diff-btn {
      font-size: 14px;
      padding: 6px 14px;
      border: 2px solid #555;
      border-radius: 12px;
      background: #222;
      color: #aaa;
      cursor: pointer;
    }

    .diff-btn.active {
      border-color: #00aa44;
      color: white;
      background: #1a3a27;
    }

    button {
      font-size: 24px;
      padding: 18px 25px;
      border: none;
      border-radius: 18px;
      margin: 8px;
      cursor: pointer;
    }

    #stats {
      font-size: 15px;
      color: #aaa;
      margin: 6px 0;
      min-height: 20px;
    }

    #leaderboard {
      font-size: 18px;
      margin-top: 10px;
    }

    #leaderboard ol {
      padding-left: 0;
      list-style: none;
    }

    #leaderboard li {
      padding: 4px 0;
    }

    #leaderboard li.best {
      color: gold;
      font-weight: bold;
    }

    .streak-badge {
      display: inline-block;
      background: #e65c00;
      color: white;
      font-size: 13px;
      border-radius: 8px;
      padding: 2px 8px;
      margin-left: 6px;
    }

    input {
      font-size: 20px;
      width: 130px;
      text-align: center;
      border-radius: 12px;
      border: none;
      padding: 8px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <h1>Reaction Time</h1>

  <input id="name" placeholder="Name" maxlength="8">

  <div id="difficulty-row">
    <button class="diff-btn active" onclick="setDifficulty('easy')">Easy</button>
    <button class="diff-btn active" id="diff-normal" onclick="setDifficulty('normal')">Normal</button>
    <button class="diff-btn" id="diff-hard" onclick="setDifficulty('hard')">Hard</button>
  </div>

  <div id="game">
    <span id="game-text">Press Start</span>
    <span id="game-sub"></span>
  </div>

  <div id="stats"></div>

  <button onclick="startGame()">Start</button>
  <button onclick="resetScores()">Reset</button>

  <div id="leaderboard">
    <h2>Leaderboard</h2>
    <ol id="scores"></ol>
  </div>

  <audio id="tap-sound" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="></audio>

  <script>
    const DIFFICULTY = {
      easy:   { minDelay: 2000, maxDelay: 4000, window: null },
      normal: { minDelay: 1500, maxDelay: 4500, window: null },
      hard:   { minDelay: 800,  maxDelay: 3000, window: 1200 },
    };

    let difficulty = 'normal';
    let waiting = false;
    let ready = false;
    let running = false;
    let startTime = 0;
    let streak = 0;
    let sessionTimes = [];
    let timeout, nextRoundTimeout, windowTimeout;

    const game      = document.getElementById("game");
    const gameText  = document.getElementById("game-text");
    const gameSub   = document.getElementById("game-sub");
    const scoresList = document.getElementById("scores");
    const statsEl   = document.getElementById("stats");

    function setDifficulty(d) {
      difficulty = d;
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('diff-' + d) || document.querySelector(`.diff-btn:nth-child(${['easy','normal','hard'].indexOf(d)+1})`);
      document.querySelectorAll('.diff-btn')[['easy','normal','hard'].indexOf(d)].classList.add('active');
    }

    function startGame() {
      running = true;
      streak = 0;
      sessionTimes = [];
      updateStats();
      nextRound();
    }

    function nextRound() {
      clearTimeout(nextRoundTimeout);
      clearTimeout(windowTimeout);
      game.style.background = "#b22222";
      gameText.textContent = "Wait...";
      gameSub.textContent = "";
      waiting = true;
      ready = false;

      const cfg = DIFFICULTY[difficulty];
      const delay = Math.random() * (cfg.maxDelay - cfg.minDelay) + cfg.minDelay;

      clearTimeout(timeout);
      timeout = setTimeout(() => {
        game.style.background = "#00aa44";
        gameText.textContent = "TAP!";
        gameSub.textContent = difficulty === 'hard' ? "Quick!" : "";
        startTime = Date.now();
        ready = true;

        if (cfg.window) {
          windowTimeout = setTimeout(() => {
            if (ready) {
              ready = false;
              waiting = false;
              streak = 0;
              game.style.background = "#555";
              gameText.textContent = "Too slow!";
              gameSub.textContent = "";
              updateStats();
              if (running) nextRoundTimeout = setTimeout(nextRound, 1200);
            }
          }, cfg.window);
        }
      }, delay);
    }

    function playTapSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.15);
      } catch(e) {}
    }

    game.onclick = function () {
      if (waiting && !ready) {
        clearTimeout(timeout);
        streak = 0;
        game.style.background = "#333";
        gameText.textContent = "Too early!";
        gameSub.textContent = "";
        waiting = false;
        updateStats();
        if (running) nextRoundTimeout = setTimeout(nextRound, 1200);
        return;
      }

      if (ready) {
        clearTimeout(windowTimeout);
        const reaction = Date.now() - startTime;

        game.classList.remove('flash');
        void game.offsetWidth;
        game.classList.add('flash');
        playTapSound();

        game.style.background = "#333";
        gameText.textContent = reaction + " ms";

        sessionTimes.push(reaction);
        streak++;

        const pb = getPersonalBest();
        if (pb === null || reaction < pb) {
          gameSub.textContent = "New best!";
        } else {
          gameSub.textContent = streak > 1 ? "Streak: " + streak : "";
        }

        saveScore(reaction);
        waiting = false;
        ready = false;
        updateStats();
        if (running) nextRoundTimeout = setTimeout(nextRound, 1400);
      }
    };

    function getPersonalBest() {
      const scores = JSON.parse(localStorage.getItem("scores") || "[]");
      const name = document.getElementById("name").value.trim() || "Player";
      const mine = scores.filter(s => s.name === name).map(s => s.time);
      return mine.length ? Math.min(...mine) : null;
    }

    function updateStats() {
      if (sessionTimes.length === 0) {
        statsEl.textContent = "";
        return;
      }
      const avg = Math.round(sessionTimes.reduce((a, b) => a + b, 0) / sessionTimes.length);
      const best = Math.min(...sessionTimes);
      let html = "Avg: " + avg + " ms &nbsp;|&nbsp; Best: " + best + " ms";
      if (streak >= 3) html += " &nbsp;<span class='streak-badge'>🔥 " + streak + "</span>";
      statsEl.innerHTML = html;
    }

    function saveScore(time) {
      let name = document.getElementById("name").value.trim();
      if (name === "") name = "Player";

      let scores = JSON.parse(localStorage.getItem("scores") || "[]");
      scores.push({ name: name, time: time });
      scores.sort((a, b) => a.time - b.time);
      scores = scores.slice(0, 10);

      localStorage.setItem("scores", JSON.stringify(scores));
      showScores();
    }

    function showScores() {
      let scores = JSON.parse(localStorage.getItem("scores") || "[]");
      scoresList.innerHTML = "";

      scores.forEach((score, i) => {
        const li = document.createElement("li");
        li.textContent = (i + 1) + ". " + score.name + " — " + score.time + " ms";
        if (i === 0) li.classList.add("best");
        scoresList.appendChild(li);
      });
    }

    function resetScores() {
      running = false;
      waiting = false;
      ready = false;
      streak = 0;
      sessionTimes = [];
      clearTimeout(timeout);
      clearTimeout(nextRoundTimeout);
      clearTimeout(windowTimeout);
      game.style.background = "#333";
      gameText.textContent = "Press Start";
      gameSub.textContent = "";
      statsEl.textContent = "";

      localStorage.removeItem("scores");
      showScores();
    }

    // init difficulty buttons
    setDifficulty('normal');
    showScores();
  </script>

</body>
</html>
