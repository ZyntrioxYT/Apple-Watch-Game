<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reaction">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Reaction Game</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      user-select: none;
    }

    /* ── Auth bar ── */
    #auth-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 10px 16px;
      gap: 10px;
      min-height: 52px;
    }

    #auth-bar img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }

    #auth-bar span {
      font-size: 14px;
      color: #ccc;
    }

    .auth-btn {
      font-size: 14px;
      padding: 7px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    #sign-in-btn  { background: white; color: #333; }
    #sign-out-btn { background: #333;  color: #aaa; }

    /* ── Title ── */
    h1 { font-size: 26px; margin: 0 0 8px; }

    /* ── Difficulty ── */
    #difficulty-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .diff-btn {
      font-size: 14px;
      padding: 6px 14px;
      border: 2px solid #555;
      border-radius: 12px;
      background: #222;
      color: #aaa;
      cursor: pointer;
    }

    .diff-btn.active {
      border-color: #00aa44;
      color: white;
      background: #1a3a27;
    }

    /* ── Game box ── */
    #game {
      margin: 0 auto 6px;
      width: 90vw;
      max-width: 350px;
      height: 230px;
      border-radius: 25px;
      background: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      padding: 10px;
      transition: background 0.1s;
    }

    #game.flash { animation: flash 0.25s ease-out; }

    @keyframes flash {
      0%   { filter: brightness(2); }
      100% { filter: brightness(1); }
    }

    #game-sub {
      font-size: 15px;
      opacity: 0.75;
      margin-top: 6px;
      min-height: 20px;
    }

    /* ── Stats ── */
    #stats {
      font-size: 15px;
      color: #aaa;
      margin: 4px 0 6px;
      min-height: 20px;
    }

    .streak-badge {
      display: inline-block;
      background: #e65c00;
      color: white;
      font-size: 13px;
      border-radius: 8px;
      padding: 2px 8px;
      margin-left: 6px;
    }

    /* ── Buttons ── */
    .game-btn {
      font-size: 24px;
      padding: 18px 25px;
      border: none;
      border-radius: 18px;
      margin: 6px;
      cursor: pointer;
    }

    /* ── Guest notice ── */
    #guest-notice {
      font-size: 13px;
      color: #888;
      margin: 6px 0 2px;
      min-height: 18px;
    }

    /* ── Leaderboard ── */
    #leaderboard { font-size: 18px; margin-top: 10px; padding-bottom: 30px; }

    #leaderboard ol {
      padding: 0;
      list-style: none;
      margin: 0 auto;
      max-width: 350px;
    }

    #leaderboard li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      border-radius: 10px;
    }

    #leaderboard li.best { background: #2a2500; }

    #leaderboard li img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
    }

    #leaderboard li .rank { color: #888; width: 22px; text-align: right; flex-shrink: 0; }
    #leaderboard li.best .rank { color: gold; }
    #leaderboard li .lname { flex: 1; text-align: left; }
    #leaderboard li.best .lname { color: gold; font-weight: bold; }
    #leaderboard li .ltime { color: #aaa; font-size: 15px; }
    #leaderboard li.best .ltime { color: gold; }

    #lb-empty { color: #555; font-size: 15px; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- Auth bar -->
  <div id="auth-bar">
    <div id="user-info" style="display:none; align-items:center; gap:8px;">
      <img id="user-photo" src="" alt="">
      <span id="user-name"></span>
      <button class="auth-btn" id="sign-out-btn" onclick="signOut()">Sign out</button>
    </div>
    <button class="auth-btn" id="sign-in-btn" onclick="signIn()">Sign in with Google</button>
  </div>

  <h1>Reaction Time</h1>

  <div id="difficulty-row">
    <button class="diff-btn" onclick="setDifficulty('easy')">Easy</button>
    <button class="diff-btn" onclick="setDifficulty('normal')">Normal</button>
    <button class="diff-btn" onclick="setDifficulty('hard')">Hard</button>
  </div>

  <div id="game">
    <span id="game-text">Press Start</span>
    <span id="game-sub"></span>
  </div>

  <div id="stats"></div>

  <button class="game-btn" onclick="startGame()">Start</button>
  <button class="game-btn" onclick="stopGame()">Stop</button>

  <div id="guest-notice"></div>

  <div id="leaderboard">
    <h2>Global Leaderboard</h2>
    <ol id="scores"><li id="lb-empty">Loading...</li></ol>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // ── Firebase init ──────────────────────────────────────────
    const firebaseConfig = {
      apiKey: "AIzaSyDDnBWZOwrPxCJcOPsAajx0cMmbyHTf6dY",
      authDomain: "apple-watch-game.firebaseapp.com",
      projectId: "apple-watch-game",
      storageBucket: "apple-watch-game.firebasestorage.app",
      messagingSenderId: "448909758594",
      appId: "1:448909758594:web:446d2ad94110ed04c1a49b"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db   = firebase.firestore();

    // ── Auth ──────────────────────────────────────────────────
    let currentUser = null;

    auth.onAuthStateChanged(user => {
      currentUser = user;
      const signInBtn  = document.getElementById('sign-in-btn');
      const userInfo   = document.getElementById('user-info');
      const userName   = document.getElementById('user-name');
      const userPhoto  = document.getElementById('user-photo');
      const notice     = document.getElementById('guest-notice');

      if (user) {
        signInBtn.style.display = 'none';
        userInfo.style.display  = 'flex';
        userName.textContent    = user.displayName || 'Player';
        userPhoto.src           = user.photoURL || '';
        notice.textContent      = '';
      } else {
        signInBtn.style.display = 'block';
        userInfo.style.display  = 'none';
        notice.textContent      = 'Sign in with Google to appear on the leaderboard';
      }
    });

    function signIn() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => console.error(err));
    }

    function signOut() {
      auth.signOut();
    }

    // ── Difficulty ────────────────────────────────────────────
    const DIFFICULTY = {
      easy:   { minDelay: 2000, maxDelay: 4000, window: null },
      normal: { minDelay: 1500, maxDelay: 4500, window: null },
      hard:   { minDelay: 800,  maxDelay: 3000, window: 1200 },
    };

    let difficulty = 'normal';

    function setDifficulty(d) {
      difficulty = d;
      document.querySelectorAll('.diff-btn').forEach((b, i) => {
        b.classList.toggle('active', ['easy','normal','hard'][i] === d);
      });
    }

    setDifficulty('normal');

    // ── Game state ────────────────────────────────────────────
    let waiting = false, ready = false, running = false;
    let startTime = 0, streak = 0;
    let sessionTimes = [];
    let timeout, nextRoundTimeout, windowTimeout;

    const game     = document.getElementById('game');
    const gameText = document.getElementById('game-text');
    const gameSub  = document.getElementById('game-sub');
    const statsEl  = document.getElementById('stats');

    function startGame() {
      running = true;
      streak = 0;
      sessionTimes = [];
      updateStats();
      nextRound();
    }

    function stopGame() {
      running = false;
      waiting = false;
      ready = false;
      clearTimeout(timeout);
      clearTimeout(nextRoundTimeout);
      clearTimeout(windowTimeout);
      game.style.background = '#333';
      gameText.textContent = 'Press Start';
      gameSub.textContent = '';
    }

    function nextRound() {
      clearTimeout(nextRoundTimeout);
      clearTimeout(windowTimeout);
      game.style.background = '#b22222';
      gameText.textContent = 'Wait...';
      gameSub.textContent = '';
      waiting = true;
      ready = false;

      const cfg = DIFFICULTY[difficulty];
      const delay = Math.random() * (cfg.maxDelay - cfg.minDelay) + cfg.minDelay;

      clearTimeout(timeout);
      timeout = setTimeout(() => {
        game.style.background = '#00aa44';
        gameText.textContent = 'TAP!';
        gameSub.textContent = difficulty === 'hard' ? 'Quick!' : '';
        startTime = Date.now();
        ready = true;

        if (cfg.window) {
          windowTimeout = setTimeout(() => {
            if (ready) {
              ready = false;
              waiting = false;
              streak = 0;
              game.style.background = '#555';
              gameText.textContent = 'Too slow!';
              gameSub.textContent = '';
              updateStats();
              if (running) nextRoundTimeout = setTimeout(nextRound, 1200);
            }
          }, cfg.window);
        }
      }, delay);
    }

    game.onclick = function () {
      if (waiting && !ready) {
        clearTimeout(timeout);
        streak = 0;
        game.style.background = '#333';
        gameText.textContent = 'Too early!';
        gameSub.textContent = '';
        waiting = false;
        updateStats();
        if (running) nextRoundTimeout = setTimeout(nextRound, 1200);
        return;
      }

      if (ready) {
        clearTimeout(windowTimeout);
        const reaction = Date.now() - startTime;

        game.classList.remove('flash');
        void game.offsetWidth;
        game.classList.add('flash');
        playTapSound();

        game.style.background = '#333';
        gameText.textContent = reaction + ' ms';

        sessionTimes.push(reaction);
        streak++;

        const sessionBest = Math.min(...sessionTimes);
        if (sessionTimes.length === 1 || reaction === sessionBest) {
          gameSub.textContent = sessionTimes.length > 1 ? 'New session best!' : '';
        } else {
          gameSub.textContent = streak >= 3 ? 'Streak: ' + streak : '';
        }

        saveScore(reaction);
        waiting = false;
        ready = false;
        updateStats();
        if (running) nextRoundTimeout = setTimeout(nextRound, 1400);
      }
    };

    // ── Sound ─────────────────────────────────────────────────
    function playTapSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.15);
      } catch(e) {}
    }

    // ── Stats ─────────────────────────────────────────────────
    function updateStats() {
      if (!sessionTimes.length) { statsEl.textContent = ''; return; }
      const avg  = Math.round(sessionTimes.reduce((a,b) => a+b, 0) / sessionTimes.length);
      const best = Math.min(...sessionTimes);
      let html = 'Avg: ' + avg + ' ms &nbsp;|&nbsp; Best: ' + best + ' ms';
      if (streak >= 3) html += " &nbsp;<span class='streak-badge'>🔥 " + streak + '</span>';
      statsEl.innerHTML = html;
    }

    // ── Firestore leaderboard ─────────────────────────────────
    // One document per user (uid = doc ID), always keeping their best score.
    async function saveScore(time) {
      if (!currentUser) return;

      const ref = db.collection('scores').doc(currentUser.uid);
      const doc = await ref.get();

      if (!doc.exists || time < doc.data().time) {
        await ref.set({
          uid:      currentUser.uid,
          name:     currentUser.displayName || 'Player',
          photoURL: currentUser.photoURL    || '',
          time:     time,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    }

    // Real-time listener — top 10 all-time
    db.collection('scores')
      .orderBy('time')
      .limit(10)
      .onSnapshot(snapshot => {
        const scoresList = document.getElementById('scores');
        scoresList.innerHTML = '';

        if (snapshot.empty) {
          scoresList.innerHTML = '<li id="lb-empty">No scores yet — be the first!</li>';
          return;
        }

        snapshot.docs.forEach((doc, i) => {
          const s  = doc.data();
          const li = document.createElement('li');
          if (i === 0) li.classList.add('best');

          const isMe = currentUser && doc.id === currentUser.uid;

          li.innerHTML =
            '<span class="rank">' + (i + 1) + '.</span>' +
            (s.photoURL ? '<img src="' + s.photoURL + '" alt="">' : '') +
            '<span class="lname">' + escHtml(s.name) + (isMe ? ' <span style="color:#4af;font-size:12px">(you)</span>' : '') + '</span>' +
            '<span class="ltime">' + s.time + ' ms</span>';

          scoresList.appendChild(li);
        });
      }, err => console.error('Leaderboard error:', err));

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/Apple-Watch-Game/sw.js');
    }
  </script>

</body>
</html>
